<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Amir Choudhary">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="55%" stop-color="#0b1233"/>
      <stop offset="100%" stop-color="#1a1030"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee;#818cf8;#f472b6;#facc15;#22d3ee" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#a78bfa">
        <animate attributeName="stop-color" values="#a78bfa;#f472b6;#22d3ee;#a78bfa" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#f472b6">
        <animate attributeName="stop-color" values="#f472b6;#22d3ee;#a78bfa;#f472b6" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="32" fill="url(#sky)"/>
  <circle cx="1080" cy="70" r="90" fill="url(#orb)">
    <animate attributeName="opacity" values="0.25;0.7;0.25" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="160" cy="250" r="70" fill="#a78bfa" opacity="0.12">
    <animate attributeName="r" values="50;80;50" dur="6s" repeatCount="indefinite"/>
  </circle>

  <path fill="#22d3ee" opacity="0.12">
    <animate attributeName="d" dur="9s" repeatCount="indefinite"
      values="M0,250 C200,210 360,280 560,230 C760,180 940,260 1200,210 L1200,320 L0,320 Z;
              M0,230 C240,270 380,200 600,250 C820,300 980,210 1200,240 L1200,320 L0,320 Z;
              M0,250 C200,210 360,280 560,230 C760,180 940,260 1200,210 L1200,320 L0,320 Z"/>
  </path>

  <circle cx="80" cy="46" r="2.5" fill="#fff">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="240" cy="28" r="2" fill="#a78bfa">
    <animate attributeName="opacity" values="0.1;1;0.1" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="980" cy="40" r="2" fill="#22d3ee">
    <animate attributeName="cy" values="40;28;40" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1120" cy="180" r="2.5" fill="#f472b6">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1.7s" repeatCount="indefinite"/>
  </circle>

  <text x="70" y="78" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" letter-spacing="8" fill="#67e8f9">CREATOR  ·  BUILDER  ·  SHIPPER</text>
  <text x="70" y="160" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="72" font-weight="800" fill="url(#neon)" filter="url(#glow)">Amir Choudhary</text>
  <text x="70" y="214" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" fill="#e2e8f0">I turn ideas into live products — web, bots, and hardware.</text>
  <rect x="70" y="236" height="5" rx="3" fill="url(#neon)">
    <animate attributeName="width" values="120;520;120" dur="5.5s" repeatCount="indefinite"/>
  </rect>
  <text x="70" y="286" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" fill="#94a3b8">Frontend JS   Python   ESP32   ESP8266   Telegram   Hugging Face   Netlify</text>
</svg>
