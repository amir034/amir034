<svg xmlns="http://www.w3.org/2000/svg" width="900" height="140" viewBox="0 0 900 140" role="img" aria-label="Amir Choudhary animated banner">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee;#818cf8;#f472b6;#22d3ee" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#f472b6;#22d3ee;#818cf8" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#f472b6">
        <animate attributeName="stop-color" values="#f472b6;#22d3ee;#818cf8;#f472b6" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>
  <rect width="900" height="140" rx="18" fill="#0b1020"/>
  <circle cx="80" cy="70" r="18" fill="none" stroke="url(#glow)" stroke-width="3">
    <animate attributeName="r" values="14;22;14" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="80" cy="70" r="6" fill="#22d3ee">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="120" y="62" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="36" font-weight="800" fill="url(#glow)">Amir Choudhary</text>
  <text x="120" y="98" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" fill="#94a3b8">Frontend JS · Python · ESP32 · Telegram · Hugging Face</text>
  <rect x="120" y="112" width="220" height="3" rx="2" fill="url(#glow)">
    <animate attributeName="width" values="80;320;80" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
